name: PanVK-Mali-kbase
on:
  workflow_dispatch:
    inputs:
      src_ref:
        description: Source branch, tag or commit to build
        default: 9be6dd63442aaefa95378b4dd8354a1b8c04c40d
  push:
    branches: [main]
    paths: ['.github/workflows/panvk-mali-kbase.yml']
permissions:
  contents: write
jobs:
  driver:
    uses: ./.github/workflows/_driver.yml
    with:
      id: PanVK-Mali-kbase
      driver: panvk
      src_repo: zenithblue-oss/panvk-kbase-android
      src_ref: ${{ inputs.src_ref || '9be6dd63442aaefa95378b4dd8354a1b8c04c40d' }}
      kind: patchset
      profile: 'g615-v11-csf'
      kmds: 'kbase'
      build_android: false
