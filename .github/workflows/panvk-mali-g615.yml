name: PanVK-Mali-G615
on:
  workflow_dispatch:
    inputs:
      src_ref:
        description: Source branch, tag or commit to build
        default: g615-1.1.4-FC
  push:
    branches: [main]
    paths: ['.github/workflows/panvk-mali-g615.yml']
permissions:
  contents: write
jobs:
  driver:
    uses: ./.github/workflows/_driver.yml
    with:
      id: PanVK-Mali-G615
      driver: panvk
      src_repo: GunaCharanTeja/panvk-kbase-android
      src_ref: ${{ inputs.src_ref || 'g615-1.1.4-FC' }}
      kind: patchset
      profile: 'g615-v11-csf'
      kmds: 'kbase'
