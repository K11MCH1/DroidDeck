name: PanVK-Mali-JM
on:
  workflow_dispatch:
    inputs:
      src_ref:
        description: Source branch, tag or commit to build
        default: master
  push:
    branches: [main]
    paths: ['.github/workflows/panvk-mali-jm.yml']
permissions:
  contents: write
jobs:
  driver:
    uses: ./.github/workflows/_driver.yml
    with:
      id: PanVK-Mali-JM
      driver: panvk
      src_repo: FristOneRR-Admin/FristOneRR-Panvk-Source
      src_ref: ${{ inputs.src_ref || 'master' }}
      kind: git
      profile: ''
      kmds: 'kbase,panfrost'
