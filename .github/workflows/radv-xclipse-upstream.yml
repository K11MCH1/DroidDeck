# Manual (non-default) RADV for Xclipse: JimVulkan's newest tagged release, both halves. The default
# driver stays radv-xclipse.yml (v1.6.0-RC). Pin the Android half in drivers.json to the same tag.
name: RADV-Xclipse-upstream
on:
  workflow_dispatch:
    inputs:
      src_ref:
        description: Source branch, tag or commit to build (an upstream JimVulkan tag)
        default: v1.7.0
  push:
    branches: [main]
    paths: ['.github/workflows/radv-xclipse-upstream.yml']
permissions:
  contents: write
jobs:
  driver:
    uses: ./.github/workflows/_driver.yml
    with:
      id: RADV-Xclipse-upstream
      driver: radv
      src_repo: JimVulkan/radv-xclipse
      src_ref: ${{ inputs.src_ref || 'v1.7.0' }}
      kind: git
      profile: ''
      kmds: 'kbase,panfrost'
