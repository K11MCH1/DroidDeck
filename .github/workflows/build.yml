name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  RELEASE_TAG: nonadreno-test
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: RADV-Xclipse
            driver: radv
            src_repo: JimVulkan/radv-xclipse
            src_ref: main
          - id: PanVK-Mali-JM
            driver: panvk
            src_repo: FristOneRR-Admin/FristOneRR-Panvk-Source
            src_ref: master
          - id: PanVK-Mali-G720
            driver: panvk
            src_repo: wonderkast02/panvk-g720-kbase-csf
            src_ref: g720-development
            kmds: kbase
          - id: PanVK-Mali-G615
            driver: panvk
            src_repo: GunaCharanTeja/panvk-kbase-android
            src_ref: main
            kind: patchset
            profile: g615-v11-csf
            kmds: kbase
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip flex bison cmake glslang-tools curl pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3-pip zip patch tar zstd xz-utils libexpat1-dev zlib1g-dev
          if [ "${{ matrix.driver }}" = panvk ]; then
            # Host-only: mesa_clc / panfrost_compile compile PanVK's OpenCL kernels at build time.
            sudo apt-get install -y llvm-18-dev libclang-18-dev libclang-cpp18-dev clang-18 \
              libclc-18-dev libclc-18 libllvmspirvlib-18-dev llvm-spirv-18 spirv-tools \
              libdrm-dev libpolly-18-dev
            sudo ln -sf /usr/bin/llvm-config-18 /usr/local/bin/llvm-config
          fi
          pip3 install --break-system-packages 'meson>=1.5' mako pyyaml packaging ply pycparser
          meson --version && aarch64-linux-gnu-gcc --version | head -1
      - name: Build
        env:
          DRIVER: ${{ matrix.driver }}
          SRC_REPO: ${{ matrix.src_repo }}
          SRC_REF: ${{ matrix.src_ref }}
          SRC_KIND: ${{ matrix.kind || 'git' }}
          PROFILE: ${{ matrix.profile }}
          PANFROST_KMDS: ${{ matrix.kmds || 'kbase,panfrost' }}
          ZIP_NAME: ${{ matrix.id }}-Linux.zip
          META_NAME: ${{ matrix.id }} (Linux, glibc)
        run: ./build_linux_driver.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-Linux
          path: linux_workdir/${{ matrix.id }}-Linux.zip
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-failed-logs
          path: |
            linux_workdir/src/build-linux/meson-logs/meson-log.txt
            linux_workdir/src/build-host/meson-logs/meson-log.txt

  # One release for everything: each run adds whatever finished and rewrites the notes.
  release:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-Linux'
          path: linux
          merge-multiple: true
      - name: Build pairs and notes
        run: |
          mkdir -p linux out
          ls -l linux
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing.txt 2>/dev/null || : > existing.txt
          python3 make_release.py linux out existing.txt
          ls -l out
      - name: Publish
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --title "DroidDeck Mali / Xclipse drivers (test)" \
              --notes-file out/NOTES.md --target "$GITHUB_SHA"
          else
            gh release edit "$RELEASE_TAG" --notes-file out/NOTES.md
          fi
          shopt -s nullglob
          files=(out/*.zip)
          if [ ${#files[@]} -gt 0 ]; then gh release upload "$RELEASE_TAG" "${files[@]}" --clobber; fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
